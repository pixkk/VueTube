// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
        def androidExt = subproject.extensions.findByName('android')
        if (androidExt != null && (!androidExt.hasProperty('namespace') || androidExt.namespace == null || androidExt.namespace.toString().trim().isEmpty())) {
            def manifestFile = new File(subproject.projectDir, "src/main/AndroidManifest.xml")
            def fallbackNamespace = "autogen.${subproject.name.replace('-', '_')}"
            if (manifestFile.exists()) {
                def manifest = new XmlSlurper().parse(manifestFile)
                def manifestPackage = manifest.@package?.text()
                if (manifestPackage != null && !manifestPackage.trim().isEmpty()) {
                    fallbackNamespace = manifestPackage.trim()
                }
            }
            androidExt.namespace = fallbackNamespace
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
