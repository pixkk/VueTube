name: CI

on:
  push:
    branches:
      - main
      - dev

env:
  NODE_VERSION: 24
  GOOGLE_SERVICE_INFO_PLIST: ${{secrets.GOOGLE_SERVICE_INFO_PLIST}}
jobs:
  build:
    name: Build web assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm i; cd NUXT; npm i
      - name: Set App Version
        working-directory: NUXT
        run: sed -i 's/dev-local/${{ github.sha }}/' nuxt.config.js
      - name: Build web assets
        working-directory: NUXT
        run: npm run generate
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: NUXT/.output/public
  android:
    name: Build Android platform
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: NUXT/.output/public
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm i
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
      - name: Copy web assets to native platform
        run: npx cap copy android
      - name: Update native platform
        run: npx cap update android
      - name: Set App Version in build.gradle
        working-directory: android/app
        run: sed -i 's/dev-local/${{ github.sha }}/' build.gradle
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/key.jks

      - name: Build with Gradle
        working-directory: android
        run: chmod +x gradlew; ./gradlew clean assembleRelease -x test -Pandroid.injected.signing.store.file=${{ github.workspace }}/key.jks -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_STORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
  ios:
    name: Build iOS platform
    runs-on: macos-14
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: NUXT/.output/public
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm i
      - name: Copy web assets to native platform
        run: npx cap copy ios
      - name: Update native platform
        run: npx cap update ios
      - name: Set up XCode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 15.4.0
      - name: Add `GoogleService-Info.plist`
        run: echo "${{ env.GOOGLE_SERVICE_INFO_PLIST }}" > ios/App/App/GoogleService-Info.plist
      - name: Build and archive with xcodebuild
        working-directory: ios
        run: |
          ARCHIVE_PATH="App/build/App.xcarchive"
          xcodebuild \
            -workspace App/App.xcworkspace \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            clean build archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED="NO" \
            CODE_SIGN_ENTITLEMENTS=""
      - name: Make IPA
        working-directory: ios
        run: |
          APP_PATH="App/build/App.xcarchive/Products/Applications/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Archive product not found at $APP_PATH"
            ls -la App/build || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          cd Payload
          zip -r ../VueTube.ipa .
    
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VueTube
          path: ios/VueTube.ipa
